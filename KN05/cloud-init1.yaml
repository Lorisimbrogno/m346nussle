#cloud-config
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, sudo  # Nutzung der Gruppe sudo statt admin
    home: /home/ubuntu
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa  aws-key
ssh_pwauth: false
disable_root: false
package_update: true
package_upgrade: true  # Aktualisierung des Paketindex
packages:
  - curl
  - wget
